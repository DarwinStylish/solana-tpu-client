name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Gateway Repository
      uses: actions/checkout@v4
    
    - name: Checkout hft_core Repository
      uses: actions/checkout@v4
      with:
        repository: DarwinStylish/hft_core
        path: hft_core
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        
    - name: Run Unit Tests
      run: make test CORE_INC=hft_core/include
